<!DOCTYPE html>
<html>
<head>
  <title>Payment Successful</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding-top: 50px; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1 id="status-message">Payment Successful! Confirming your order...</h1>
  <div id="spinner" class="spinner"></div>
  <p id="info"></p>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const urlParams = new URLSearchParams(window.location.search);
      const sessionId = urlParams.get('session_id');
      const statusMessage = document.getElementById('status-message');
      const spinner = document.getElementById('spinner');
      const info = document.getElementById('info');

      if (!sessionId) {
        statusMessage.textContent = 'Error: No session ID found.';
        spinner.style.display = 'none';
        return;
      }

      // Call your backend to confirm the payment
      fetch(`http://localhost:8000/confirm_payment.php?session_id=${sessionId}`)
        .then(response => response.json())
        .then(data => {
          spinner.style.display = 'none';
          if (data.success) {
            statusMessage.textContent = 'Order Confirmed!';
            info.textContent = 'Your receipt has been updated. You can now close this window.';
          } else {
            statusMessage.textContent = 'Error Confirming Order';
            info.textContent = `There was an issue: ${data.message || 'Unknown error'}. Please contact support.`;
          }
        })
        .catch(error => {
          spinner.style.display = 'none';
          statusMessage.textContent = 'Error';
          info.textContent = 'Could not connect to the server to confirm your order. Please check your connection or contact support.';
          console.error('Error:', error);
        });
    });
  </script>
</body>
</html>
